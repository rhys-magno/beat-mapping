[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kickroll-beatmap-generator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "librosa==0.10.2",
    "numpy==1.26.4",
    "scipy==1.13.0",
    "soundfile==0.12.1",
    "click==8.1.7",
]

[project.scripts]
kickroll-beatmap = "kickroll_beatmap_generator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kickroll_beatmap_generator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
